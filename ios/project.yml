# MK Prod for iPhone and iPad. The Xcode project is generated from this file with XcodeGen
# (`brew install xcodegen && cd ios && xcodegen`), so there is no .xcodeproj to merge by hand.
# GitHub builds it in .github/workflows/ios.yml.
name: MKProd
options:
  bundleIdPrefix: com.mkoussa
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"          # overridden by the workflow from the VERSION file
    CURRENT_PROJECT_VERSION: "1"        # overridden by the workflow (run number)
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""                # set by the workflow when signing secrets exist
targets:
  MKProd:
    type: application
    platform: iOS
    sources:
      - path: MKProd
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: MKProd
        PRODUCT_BUNDLE_IDENTIFIER: com.mkoussa.mkprod
        TARGETED_DEVICE_FAMILY: "1,2"             # iPhone and iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
    info:
      path: MKProd/Info.plist
      properties:
        CFBundleDisplayName: MK Prod
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.business
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Logo
          UIImageRespectsSafeAreaInsets: true
        UIRequiresFullScreen: false             # iPad Split View and Slide Over
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # mkprod://… opens a page in the app, e.g. mkprod://approvals
        CFBundleURLTypes:
          - CFBundleURLName: com.mkoussa.mkprod
            CFBundleURLSchemes: [mkprod]
        # The page's "attach file" button offers the camera; iOS requires a reason.
        NSCameraUsageDescription: Take a photo to attach to a task or an order.
        NSPhotoLibraryAddUsageDescription: Save exported files and attachments to Photos.
        # Encryption: only the standard, OS-provided WebCrypto and HTTPS (exempt from export filings).
        ITSAppUsesNonExemptEncryption: false
