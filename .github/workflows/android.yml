# Builds the Android app (.apk) and publishes it as a GitHub Release. Runs whenever android/
# changes on main, or by hand.
#
# Signing: with the four ANDROID_* repository secrets set (see ANDROID.md), the APK is signed
# with your permanent key, so new versions install over old ones. Without them a throwaway key
# is used and the release notes say so (updates then need an uninstall first).
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'VERSION', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storepass temporary1 -keypass temporary1 \
              -alias mkprod -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MK Prod temporary key" >/dev/null 2>&1
            echo "permanent=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed APK
        working-directory: android
        env:
          APP_VERSION: ${{ steps.v.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ steps.key.outputs.permanent == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary1' }}
          KEY_ALIAS: ${{ steps.key.outputs.permanent == 'true' && secrets.ANDROID_KEY_ALIAS || 'mkprod' }}
          KEY_PASSWORD: ${{ steps.key.outputs.permanent == 'true' && secrets.ANDROID_KEY_PASSWORD || 'temporary1' }}
        run: |
          gradle assembleRelease --no-daemon --warning-mode=summary
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MK-Prod-$APP_VERSION-android.apk"
          ls -la dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.v.outputs.version }}
          name: MK Prod for Android ${{ steps.v.outputs.version }}
          body: |
            **Install:** download `MK-Prod-${{ steps.v.outputs.version }}-android.apk` on the phone and open it. Android asks once to allow installs from your browser/files app (Settings → Install unknown apps); Play Protect may add a warning for apps outside the store: choose **Install anyway**.

            Android 7.0 and newer; phones, tablets and foldables (the layout follows every fold, unfold and rotation).

            ${{ steps.key.outputs.permanent == 'true' && 'Signed with the permanent MK Prod key: newer versions install over this one.' || '⚠ Signed with a temporary key (no ANDROID_* secrets configured yet): to install a newer build later, uninstall this one first. See ANDROID.md.' }}
          files: android/dist/MK-Prod-*-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android/dist/*.apk
